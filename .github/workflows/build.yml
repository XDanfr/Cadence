name: Build Cadence
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  assets:
    name: Compile layered icon on Tahoe
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Compile Icon Composer artwork and accent colour
        run: bash scripts/compile-assets.sh dist/compiled-assets
      - uses: actions/upload-artifact@v4
        with:
          name: Cadence-compiled-assets
          path: dist/compiled-assets/
          if-no-files-found: error
  build:
    needs: assets
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26
        run: sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
      - name: Toolchain
        run: swift --version
      - name: Test timer, notifications and persistence
        run: swift test
      - uses: actions/download-artifact@v4
        with:
          name: Cadence-compiled-assets
          path: dist/compiled-assets
      - name: Build universal Sequoia app
        env:
          CADENCE_COMPILED_ASSETS: dist/compiled-assets
        run: bash scripts/build.sh
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install disk image builder
        run: python3 -m pip install dmgbuild==1.6.7
      - name: Package and verify styled DMG
        run: |
          bash scripts/package-dmg.sh
          bash scripts/verify-dmg.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Cadence-release-packages
          path: dist/release/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: Cadence-DMG-preview
          path: dist/installer/
          if-no-files-found: error
      - name: Smoke test app launch on Sequoia
        run: |
          open dist/Cadence.app
          sleep 5
          pgrep -x Cadence
          screencapture -x dist/Cadence-Sequoia.png
          pkill -x Cadence
      - name: Probe native notification request on Sequoia
        run: |
          open -n dist/Cadence.app --args --notification-probe "$PWD/dist/Cadence-notification-probe.txt"
          sleep 8
          cat dist/Cadence-notification-probe.txt
          pkill -x Cadence
      - uses: actions/upload-artifact@v4
        with:
          name: Cadence-notification-probe
          path: dist/Cadence-notification-probe.txt
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: Cadence-macOS
          path: dist/Cadence-macOS.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: Cadence-Sequoia-preview
          path: dist/Cadence-Sequoia.png
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: Cadence-IconComposer-layers
          path: dist/IconComposer/
          if-no-files-found: error
