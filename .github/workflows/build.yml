name: Build Cadence
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  assets:
    name: Compile layered icon on Tahoe
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Compile Icon Composer artwork and accent colour
        run: bash scripts/compile-assets.sh dist/compiled-assets
      - uses: actions/upload-artifact@v4
        with:
          name: Cadence-compiled-assets
          path: dist/compiled-assets/
          if-no-files-found: error
  build:
    needs: assets
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26
        run: sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
      - name: Toolchain
        run: swift --version
      - name: Test timer engine
        run: swift test
      - uses: actions/download-artifact@v4
        with:
          name: Cadence-compiled-assets
          path: dist/compiled-assets
      - name: Build universal Sequoia app
        env:
          CADENCE_COMPILED_ASSETS: dist/compiled-assets
        run: bash scripts/build.sh
      - name: Smoke test app launch on Sequoia
        run: |
          open dist/Cadence.app
          sleep 5
          pgrep -x Cadence
          screencapture -x dist/Cadence-Sequoia.png
          pkill -x Cadence
      - uses: actions/upload-artifact@v4
        with:
          name: Cadence-macOS
          path: dist/Cadence-macOS.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: Cadence-Sequoia-preview
          path: dist/Cadence-Sequoia.png
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: Cadence-IconComposer-layers
          path: dist/IconComposer/
          if-no-files-found: error
